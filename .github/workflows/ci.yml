name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
    # Note: `next build` is intentionally NOT run here — it statically generates
    # article pages from Supabase and needs DB env/secrets. The production build
    # is validated by Vercel on deploy.
